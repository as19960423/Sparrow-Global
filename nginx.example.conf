# Global Sparrow — дополнительные директивы nginx.
#
# Нужно, ЕСЛИ перед Apache стоит nginx и включена раздача статики напрямую
# (в Plesk: «Хостинг и DNS -> Настройки Apache и nginx -> Обслуживание
# статических файлов непосредственно с помощью nginx»).
# Без этого nginx будет искать статику в корне httpdocs и отдавать 404,
# так как файлы лежат в /htdocs.
#
# Куда вставлять (Plesk): Сайты -> домен -> Настройки Apache и nginx ->
# «Дополнительные директивы nginx».
#
# Если раздача статики nginx ВЫКЛЮЧЕНА (всё проксируется в Apache),
# этот файл не нужен — корневой .htaccess сделает всю работу сам.

# Исходники и служебные файлы недоступны снаружи
# (assets не блокируем: URL /assets/* переписывается в /htdocs/assets/*)
location ~ ^/(\.git|node_modules|src|public|scripts|google-apps-script|\.prerender)(/|$) {
    return 404;
}
location ~ ^/(package(-lock)?\.json|tsconfig\.json|vite\.config\.ts|metadata\.json|README\.md|index\.html|nginx\.example\.conf)$ {
    return 404;
}

# Конфиг с секретами PHP API
location ~ /api/config(\.example)?\.php$ {
    return 404;
}

# Все запросы (кроме уже указывающих в /htdocs) переписываем внутрь /htdocs:
# статику nginx отдаст сам, остальное уйдёт в Apache уже с правильным путём.
location / {
    rewrite ^/((?!htdocs/).*)$ /htdocs/$1;
}
